
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character encoding -->

    <!-- Makes the webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google University - Campus Gallery</title>

    <!-- Connects the CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- University Header -->
    <header>
        <h1>Google University</h1>
        <p>Welcome to the Google University Admission Portal</p>

    <section id="gallery">

            </figure>

            <figure>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5_wrgMEwzBMmI4eJp__drDEE4ZmRmAhnWOYjW9BK5RA&s=10"
                     alt="Computer laboratory">
                <figcaption>Computer Laboratory</figcaption>
            </figure>

            <figure>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSUuihaMLtstpJdRPyR_ZnxmRrLDtf3gWImjKhF9Kmrw&s=10"
                     alt="University auditorium">
                <figcaption>University Auditorium</figcaption>
            </figure>

        </div>

    </section>

    <!-- University Footer -->
    <footer id="contact">

        <h2>Contact Us</h2>

        <p>Email: admissions@googleuniversity.edu</p>
        <p>Phone: +91 9876543210</p>
        <p>Address: Coimbatore, Tamil Nadu, India</p>

        <p>&copy; 2027 Google University. All Rights Reserved.</p>

    </footer>

</body>
</html>
